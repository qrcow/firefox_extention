<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="app-header">
    <img src="../icons/icon-32.png" alt="" width="20" height="20" />
    <span class="app-title">qr-cow</span>
    <span id="copied-toast" class="copied-toast" hidden></span>
  </header>

  <nav id="type-chips" class="type-chips" aria-label="Content type">
    <!-- 4 chips + More select injected by main.ts -->
  </nav>

  <section id="form" class="form"></section>

  <section class="preview-wrap">
    <div id="preview" class="preview">
      <p id="preview-empty" class="preview-empty"></p>
      <!-- renderPreview wipes THIS node, never #preview itself — clearing the
           parent destroyed #preview-empty after the first render and every
           later refresh crashed on empty.hidden (frozen popup). -->
      <div id="preview-canvas"></div>
    </div>
    <p id="scannability" class="scannability" hidden></p>
  </section>

  <section id="presets" class="presets" aria-label="Presets"></section>

  <section class="colors">
    <label class="color-field">
      <span id="fg-label"></span>
      <input type="color" id="fg" value="#1F2937" />
    </label>
    <label class="color-field">
      <span id="bg-label"></span>
      <input type="color" id="bg" value="#FFFFFF" />
    </label>
    <label class="check-field">
      <input type="checkbox" id="transparent" />
      <span id="transparent-label"></span>
    </label>
  </section>

  <section class="actions">
    <button id="download-png" class="btn btn-primary"></button>
    <button id="download-svg" class="btn btn-outline"></button>
    <button id="copy" class="btn btn-outline btn-icon" title=""></button>
  </section>

  <footer class="app-footer">
    <a id="open-studio" href="#"></a>
    <a id="open-site" href="#">qr-cow.com</a>
  </footer>

  <script src="main.js"></script>
</body>
</html>
