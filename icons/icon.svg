<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC44D"/>
      <stop offset="0.55" stop-color="#F97316"/>
      <stop offset="1" stop-color="#EA580C"/>
    </linearGradient>
  </defs>

  <!-- gradient tile -->
  <rect width="128" height="128" rx="28" fill="url(#tile)"/>

  <!-- classic QR geometry, rounded & white -->
  <g fill="none" stroke="#FFFFFF" stroke-width="9">
    <!-- three finder rings -->
    <rect x="21" y="21" width="30" height="30" rx="9"/>
    <rect x="77" y="21" width="30" height="30" rx="9"/>
    <rect x="21" y="77" width="30" height="30" rx="9"/>
  </g>
  <g fill="#FFFFFF">
    <!-- finder pupils -->
    <rect x="31.5" y="31.5" width="9" height="9" rx="3"/>
    <rect x="87.5" y="31.5" width="9" height="9" rx="3"/>
    <rect x="31.5" y="87.5" width="9" height="9" rx="3"/>
    <!-- alignment marker, bottom-right like a real QR -->
    <rect x="80" y="80" width="27" height="27" rx="8" fill="none" stroke="#FFFFFF" stroke-width="7"/>
    <circle cx="93.5" cy="93.5" r="4.5"/>
    <!-- timing-ish data dots -->
    <circle cx="64" cy="26" r="5.5"/>
    <circle cx="64" cy="45" r="5.5"/>
    <circle cx="26" cy="64" r="5.5"/>
    <circle cx="45" cy="64" r="5.5"/>
    <circle cx="64" cy="64" r="6.5"/>
    <circle cx="64" cy="93.5" r="5.5"/>
    <circle cx="93.5" cy="64" r="5.5"/>
  </g>
</svg>
