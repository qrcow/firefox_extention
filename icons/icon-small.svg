<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Simplified variant for 16px: same tile, finders + center dot only,
       heavier strokes. The full icon.svg turns to mush at toolbar size. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC44D"/>
      <stop offset="0.55" stop-color="#F97316"/>
      <stop offset="1" stop-color="#EA580C"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="24" fill="url(#tile)"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="13">
    <rect x="18" y="18" width="36" height="36" rx="10"/>
    <rect x="74" y="18" width="36" height="36" rx="10"/>
    <rect x="18" y="74" width="36" height="36" rx="10"/>
  </g>
  <g fill="#FFFFFF">
    <rect x="80" y="80" width="30" height="30" rx="9"/>
  </g>
</svg>
